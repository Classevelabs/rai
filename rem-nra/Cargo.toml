[package]
name = "classeve-rai-rem-nra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Local resonance memory backend used by the RAI workspace"
readme = "../README.md"
keywords = ["memory", "associative-memory", "ai"]
categories = ["science"]

# Keep the original crate (import) name: code does `use rem_nra::...`.
[lib]
name = "rem_nra"
path = "src/lib.rs"

[dependencies]
nalgebra = { version = "0.33", features = ["serde-serialize"] }
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
