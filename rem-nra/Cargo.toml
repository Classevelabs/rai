# NOT PART OF THE RAI PRODUCT (decided 2026-08-13).
#
# RAI is a CPU-only LLM inference engine: rai-infer plus rai-compress.
# This crate belongs to a separate memory/reasoning service that shares
# the workspace and nothing else — rai-server imports rai-infer zero
# times and cannot run a model.
#
# Publishing it under the RAI name told developers on crates.io that the
# product was something it is not. 0.1.0 is YANKED and publish is
# disabled so it cannot go back by accident.
# Resonance-memory backend for the memory layer. NOT part of the RAI product.
[package]
publish = false
name = "classeve-rai-rem-nra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Local resonance memory backend used by the RAI workspace"
readme = "../README.md"
keywords = ["memory", "associative-memory", "ai"]
categories = ["science"]

# Keep the original crate (import) name: code does `use rem_nra::...`.
[lib]
name = "rem_nra"
path = "src/lib.rs"

[dependencies]
nalgebra = { version = "0.33", features = ["serde-serialize"] }
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
