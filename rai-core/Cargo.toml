[package]
name = "classeve-rai-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Resonance-Augmented Intelligence — core memory, embedding, and reasoning primitives"
readme = "../README.md"
keywords = ["ai", "memory", "reasoning", "embeddings"]
categories = ["science"]

# Keep the original crate (import) name: code does `use rai_core::...`.
[lib]
name = "rai_core"
path = "src/lib.rs"

[dependencies]
# Dependency key stays `rem-nra` so `use rem_nra::...` keeps resolving;
# `package` points at the published crates.io name.
rem-nra = { path = "../rem-nra", version = "0.1.0", package = "classeve-rai-rem-nra" }
nalgebra = { version = "0.33", features = ["serde-serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"
rand = "0.8"
rand_distr = "0.4"
thiserror = "2"
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
