# NOT PART OF THE RAI PRODUCT (decided 2026-08-13).
#
# RAI is a CPU-only LLM inference engine: rai-infer plus rai-compress.
# This crate belongs to a separate memory/reasoning service that shares
# the workspace and nothing else — rai-server imports rai-infer zero
# times and cannot run a model.
#
# Publishing it under the RAI name told developers on crates.io that the
# product was something it is not. 0.1.0 is YANKED and publish is
# disabled so it cannot go back by accident.
# Memory, embedding and reasoning primitives. NOT part of the RAI product.
[package]
publish = false
name = "classeve-rai-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Resonance-Augmented Intelligence — core memory, embedding, and reasoning primitives"
readme = "../README.md"
keywords = ["ai", "memory", "reasoning", "embeddings"]
categories = ["science"]

# Keep the original crate (import) name: code does `use rai_core::...`.
[lib]
name = "rai_core"
path = "src/lib.rs"

[dependencies]
# Dependency key stays `rem-nra` so `use rem_nra::...` keeps resolving;
# `package` points at the published crates.io name.
rem-nra = { path = "../rem-nra", version = "0.2.0", package = "classeve-rai-rem-nra" }
nalgebra = { version = "0.33", features = ["serde-serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"
rand = "0.8"
rand_distr = "0.4"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
