name: Release

# Publishes a release, in this order:
#
#   1. prepare      the tag names one commit, CI passed on it, a draft opens
#   2. dist         every download is built from that commit (dist.yml)
#   3. clean-room   each is installed and used on clean machines: Windows
#                   without the Visual C++ runtime, both kinds of Mac, ten
#                   Linux distributions; each downloads a model, converts it
#                   and must answer a question correctly (clean-room.yml)
#   4. attach       only the files that passed, attested, go on the draft
#   5. publish      every file is downloaded back and checked, then published
#   6. verify-public  the one-line installers run again against the release
#                   people now see
#
# The build flags and the reasons for them live in dist.yml. Nothing here
# publishes to crates.io; that is publish.yml.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v0.2.0)"
        required: true
        type: string

# One group per release whichever way it was started: `github.ref` is
# `refs/tags/vX` for a tag push but the input is `vX` for a dispatch, and
# keying on both let two runs for one tag overlap.
concurrency:
  group: release-${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  # The portable floor is per-target and lives in the build matrix: an x86 CPU
  # name is not a thing aarch64 understands, and setting one here would fail
  # the ARM build outright. NOT target-cpu=native anywhere — see the header.

jobs:
  prepare:
    name: Resolve tag, require green CI, open draft release
    runs-on: ubuntu-24.04
    # Most of this is waiting for CI on the tagged commit to finish.
    timeout-minutes: 100
    permissions:
      contents: write
      actions: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      sha: ${{ steps.tag.outputs.sha }}
      release_id: ${{ steps.draft.outputs.release_id }}

    steps:
      - name: Resolve the tag to the commit it names
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # Via the environment, never interpolated into the script body:
          # workflow_dispatch input is attacker-shaped text, and `${{ }}` inside
          # a run block is textual substitution, not a shell argument.
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          tag="$RAW_TAG"

          # Anything that is not a plain version tag is refused rather than
          # passed on to gh and the archive names.
          if ! printf '%s' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::'$tag' is not a version tag of the form vMAJOR.MINOR.PATCH"
            exit 1
          fi

          # Resolved once, here, from the tag namespace only (a branch of the
          # same name does not count), and handed to every job as a commit:
          # a tag moved between a failed job and its re-run would otherwise
          # build some platforms from one commit and the rest from another.
          ref=$(gh api "repos/$REPO/git/ref/tags/$tag") \
            || { echo "::error::$tag is not a tag in $REPO"; exit 1; }
          sha=$(jq -r '.object.sha' <<<"$ref")
          if [ "$(jq -r '.object.type' <<<"$ref")" = "tag" ]; then
            sha=$(gh api "repos/$REPO/git/tags/$sha" --jq '.object.sha')
          fi
          if ! printf '%s' "$sha" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::$tag does not resolve to a commit"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "$tag is $sha"

      - name: Checkout the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.sha }}
          persist-credentials: false

      - name: Verify the tag matches the workspace version
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          set -euo pipefail

          tag="$TAG"
          version="$VERSION"
          test "$(git rev-parse HEAD)" = "$SHA"

          # A tag that disagrees with Cargo.toml ships archives whose names lie
          # about what is inside them. Catch it before anything is built. Every
          # crate inherits version.workspace, so disagreement among them is
          # itself a defect worth failing on.
          declared=$(cargo metadata --locked --format-version 1 --no-deps \
            | jq -r '[.packages[].version] | unique | if length == 1 then .[0] else "MIXED" end')

          if [ "$declared" = "MIXED" ]; then
            echo "::error::workspace crates do not all declare the same version"
            exit 1
          fi

          echo "tag=$tag"
          echo "tag version=$version"
          echo "workspace version=$declared"

          if [ "$version" != "$declared" ]; then
            echo "::error::tag $tag implies version $version but the workspace declares $declared"
            exit 1
          fi

      # The release consumes CI instead of running beside it: docs/RELEASE.md
      # has always required green CI on the exact commit, and nothing enforced
      # it, so v0.2.5 was tagged on a tree that failed clippy and the Python
      # suite. A tag pushed with its commit waits here for that commit's run.
      - name: Require green CI on this exact commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 90 * 60 ))
          while :; do
            # A pull_request run tests the branch merged into main, not this
            # commit, so only runs of the commit itself count.
            runs=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=100" \
                     --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")]')
            passed=$(jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length' <<<"$runs")
            running=$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")
            if [ "$passed" -gt 0 ]; then
              echo "CI passed on $SHA"
              break
            fi
            if [ "$running" -eq 0 ]; then
              echo "::error::CI has no successful run on $SHA. Release only a commit CI passed;"
              echo "::error::if its run was cancelled by a later push, start CI on the tag"
              echo "::error::(gh workflow run ci.yml --ref <tag>) and re-run this workflow."
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::CI on $SHA did not finish within 90 minutes"
              exit 1
            fi
            echo "CI is still running on $SHA; waiting"
            sleep 60
          done

      - name: Open the draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          # Assets are uploaded by the per-platform jobs, so the release has to
          # exist first. It stays a draft until SHA256SUMS is attached: a
          # published release missing its checksums teaches people to skip
          # verifying, which is worse than a late release.
          # The id is recorded and handed downstream because a *draft* release
          # cannot be reliably addressed by tag: `gh release view/download`
          # resolves drafts by listing them rather than by ref, and answers
          # "release not found" often enough that the checksum job cannot be
          # built on it. An id is unambiguous whether or not it is a draft.
          #
          # Creating it through the REST API rather than `gh release create` is
          # what makes the id available without asking for it: the POST returns
          # the release it just made.
          #
          # A release for this tag is looked for first. A draft is not bound to
          # its tag until it is published, so GitHub accepts a second draft
          # for the same tag: a re-run that created before looking left the
          # first draft behind with half its archives. The listing has returned
          # 503 mid-release, so a failed call is retried; an empty answer is
          # the normal first run.
          find_release() {
            local listing
            for attempt in 1 2 3 4 5; do
              if listing=$(gh api "repos/$REPO/releases" --paginate \
                             --jq '.[] | "\(.tag_name) \(.id)"'); then
                awk -v tag="$TAG" '$1 == tag { print $2; exit }' <<<"$listing"
                return 0
              fi
              echo "listing releases failed (attempt $attempt) — retrying" >&2
              sleep $((attempt * 5))
            done
            return 1
          }

          # Only a draft is resumed. A published release is immutable: a re-run
          # used to rebuild and replace its archives and rewrite SHA256SUMS
          # weeks later, under hashes people had already pinned.
          resume_draft() {
            if [ "$(gh api "repos/$REPO/releases/$1" --jq '.draft')" != "true" ]; then
              echo "::error::$TAG is already published. Published artifacts are never"
              echo "::error::replaced; fix forward with a new version."
              exit 1
            fi
            echo "Release $TAG exists as a draft — resuming it."
          }

          cat > notes.md <<'NOTES'
          ## Install

          **Windows:** download `rai-@VERSION@-windows-x64-setup.exe` below and run it. If Windows shows "Windows protected your PC", choose **More info**, then **Run anyway**. Or, in PowerShell:

          ```
          irm https://github.com/Classevelabs/rai/releases/latest/download/install.ps1 | iex
          ```

          **macOS and Linux:** in a terminal:

          ```
          curl -fsSL https://github.com/Classevelabs/rai/releases/latest/download/install.sh | sh
          ```

          **Linux packages:**

          - Ubuntu and Debian: `sudo apt install ./rai_@VERSION@_amd64.deb`
          - Fedora and RHEL: `sudo dnf install ./rai-@VERSION@-1.x86_64.rpm`
          - openSUSE: `sudo zypper install --allow-unsigned-rpm ./rai-@VERSION@-1.x86_64.rpm`

          Then open **RAI Studio** from the Start menu or your app menu, or run `rai-studio`. The first time, it offers to download a model to chat with. The archives (`.zip`, `.tar.gz`) hold the same program for running without installing.

          ## Check your download

          Every file is listed in `SHA256SUMS`. Put it next to your download and run `sha256sum --ignore-missing -c SHA256SUMS` (on Windows, `certutil -hashfile <file> SHA256` and compare). Each file also carries a signed build-provenance attestation that ties it to this repository and the tagged commit: `gh attestation verify <file> --repo Classevelabs/rai`.

          ## What it needs

          A 64-bit Intel or AMD processor from 2011 or later (with AVX2, as most Intel Core and AMD Ryzen chips since 2015 have, it takes its fast path), or an Apple Silicon Mac, where it runs natively. No graphics card. On Linux, glibc 2.28 or newer: Ubuntu 20.04, Debian 10, RHEL 8 or anything newer.

          Every download here was installed on clean Windows, macOS and Linux machines before release, where it downloaded a model, converted it and answered a question.

          ## Privacy

          The `rai` program never connects to the internet, and RAI Studio answers only your own computer. `rai-get-model` downloads models from Hugging Face, and only when you run it.

          What changed in this release: see `CHANGELOG.md`.
          NOTES
          sed -i "s/@VERSION@/${TAG#v}/g" notes.md

          # Three outcomes of the POST worth telling apart. 422 means the
          # release appeared since it was looked for. 5xx means GitHub is having
          # a bad day — that has taken a release down mid-flight, and it
          # deserves a retry rather than a tag that has to be cut again.
          # Anything else is a real failure and should stop the release.
          id=$(find_release)
          if [ -n "$id" ]; then
            resume_draft "$id"
          fi
          for attempt in 1 2 3 4 5 6; do
            [ -z "$id" ] || break
            if id=$(gh api --method POST "repos/$REPO/releases" \
                      -f tag_name="$TAG" \
                      -f name="RAI $TAG" \
                      -F body=@notes.md \
                      -F draft=true \
                      -F prerelease=false \
                      --jq '.id' 2>create.err); then
              echo "created draft release $id"
              break
            fi

            cat create.err >&2

            if grep -q 'already_exists\|HTTP 422' create.err; then
              id=$(find_release)
              if [ -z "$id" ]; then
                echo "::error::GitHub says $TAG has a release, but none is listed for it"
                exit 1
              fi
              resume_draft "$id"
              break
            fi

            if grep -qE 'HTTP 5[0-9][0-9]|No server is currently available' create.err; then
              echo "GitHub returned a server error (attempt $attempt) — retrying"
              id=""
              sleep $((attempt * 20))
              continue
            fi

            exit 1
          done

          test -n "$id"
          echo "release_id=$id" >> "$GITHUB_OUTPUT"
          echo "draft release id: $id"

  dist:
    name: Build
    needs: prepare
    uses: ./.github/workflows/dist.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      sha: ${{ needs.prepare.outputs.sha }}

  # Nothing reaches the release that has not been installed and used on clean
  # machines: bare Windows, both kinds of Mac, ten Linux distributions, each
  # downloading a model, converting it and answering a question.
  clean-room:
    name: Clean room
    needs: dist
    uses: ./.github/workflows/clean-room.yml
    with:
      source: artifact

  attach:
    name: Attest and attach the tested files
    needs: [prepare, clean-room]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      # Build provenance: a signed statement that this workflow, at this
      # commit, produced each file.
      id-token: write
      attestations: write
    steps:
      - name: Fetch the files the clean room tested
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rai-dist
          path: release

      - name: Check them against their SHA256SUMS
        shell: bash
        run: cd release && sha256sum -c SHA256SUMS

      - name: Attest each file's build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*

      - name: Upload every file to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_ID"
          for asset in release/*; do
            name=$(basename "$asset")
            # By id: a draft cannot be found reliably by its tag. A file of the
            # same name is a re-run of this draft; the API will not replace it,
            # so it is removed first.
            existing=$(gh api --paginate "repos/$REPO/releases/$RELEASE_ID/assets" \
                         --jq ".[] | select(.name == \"$name\") | .id" || true)
            for old in $existing; do
              gh api --method DELETE "repos/$REPO/releases/assets/$old" || true
            done
            type=application/octet-stream
            case "$name" in SHA256SUMS|*.sh|*.ps1) type=text/plain ;; esac
            for attempt in 1 2 3 4 5; do
              if gh api --method POST \
                   "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$name" \
                   -H "Content-Type: $type" --input "$asset" --silent; then
                echo "uploaded $name"
                break
              fi
              if [ "$attempt" -eq 5 ]; then echo "::error::could not upload $name"; exit 1; fi
              echo "upload of $name failed (attempt $attempt), retrying"
              sleep $((attempt * 15))
            done
          done

  publish:
    name: Check what GitHub serves, then publish
    needs: [prepare, attach]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download every file back from the draft and check it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          # Hashing what the release serves, not what a job had on disk, is
          # the only check that catches a truncated or clobbered upload.
          mkdir -p served
          for attempt in 1 2 3 4 5; do
            if gh api --paginate "repos/$REPO/releases/$RELEASE_ID/assets" \
                 --jq '.[] | "\(.id) \(.name)"' > assets.txt; then break; fi
            echo "asset listing failed (attempt $attempt), retrying"; sleep $((attempt * 5))
          done
          while read -r id name; do
            gh api -H "Accept: application/octet-stream" "repos/$REPO/releases/assets/$id" > "served/$name"
          done < assets.txt
          ls -l served
          # Nine files and their SHA256SUMS; a short list would bless some
          # downloads and leave the rest unverifiable.
          [ "$(ls served | wc -l)" -eq 10 ] || { echo "::error::the draft holds $(ls served | wc -l) files, not 10"; exit 1; }
          cd served && sha256sum -c SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        shell: bash
        run: |
          gh api --method PATCH "repos/$REPO/releases/$RELEASE_ID" -F draft=false \
            --jq '"published \(.tag_name) with \(.assets|length) files"'

  # Once more from the public side: the one-line installers and packages,
  # downloaded from the release a person now sees.
  verify-public:
    name: Install what GitHub now serves
    needs: [prepare, publish]
    uses: ./.github/workflows/clean-room.yml
    with:
      source: release
      tag: ${{ needs.prepare.outputs.tag }}
