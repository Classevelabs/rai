name: Release

# Publishes the downloadable binaries. Until this existed the only way to get
# RAI was `git clone` + `cargo build`, which is not a product.
#
# The one thing this workflow must never build with is `target-cpu=native`. A
# release built that way runs only on CPUs at least as new as whichever runner
# happened to pick up the job, and fails everywhere else with SIGILL on the
# first instruction it does not know — after download, after install, with no
# diagnostic. `.cargo/config.toml` pins the same portable x86-64-v2 floor for
# x86 targets, so the two agree; every build job still sets RUSTFLAGS from its
# matrix entry and asserts it, because that config file is one edit away from
# being changed back and a release is the wrong place to find out.
#
# The floor is per-target. aarch64 builds at the toolchain default — an x86 CPU
# name means nothing there and would fail the build — and the assertion knows
# which answer to expect for which architecture.
#
# Nothing here publishes to crates.io. That is a separate, human-approved act.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v0.2.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  # The portable floor is per-target and lives in the build matrix: an x86 CPU
  # name is not a thing aarch64 understands, and setting one here would fail
  # the ARM build outright. NOT target-cpu=native anywhere — see the header.

jobs:
  prepare:
    name: Resolve tag and open draft release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      release_id: ${{ steps.draft.outputs.release_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Resolve tag and verify it matches the workspace version
        id: resolve
        shell: bash
        env:
          # Via the environment, never interpolated into the script body:
          # workflow_dispatch input is attacker-shaped text, and `${{ }}` inside
          # a run block is textual substitution, not a shell argument.
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          tag="$RAW_TAG"

          # Anything that is not a plain version tag is refused rather than
          # passed on to gh and the archive names.
          if ! printf '%s' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::'$tag' is not a version tag of the form vMAJOR.MINOR.PATCH"
            exit 1
          fi

          version="${tag#v}"

          # A tag that disagrees with Cargo.toml ships archives whose names lie
          # about what is inside them. Catch it before anything is built. Every
          # crate inherits version.workspace, so disagreement among them is
          # itself a defect worth failing on.
          declared=$(cargo metadata --locked --format-version 1 --no-deps \
            | jq -r '[.packages[].version] | unique | if length == 1 then .[0] else "MIXED" end')

          if [ "$declared" = "MIXED" ]; then
            echo "::error::workspace crates do not all declare the same version"
            exit 1
          fi

          echo "tag=$tag"
          echo "tag version=$version"
          echo "workspace version=$declared"

          if [ "$version" != "$declared" ]; then
            echo "::error::tag $tag implies version $version but the workspace declares $declared"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Open the draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.resolve.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          # Assets are uploaded by the per-platform jobs, so the release has to
          # exist first. It stays a draft until SHA256SUMS is attached: a
          # published release missing its checksums teaches people to skip
          # verifying, which is worse than a late release.
          # The id is recorded and handed downstream because a *draft* release
          # cannot be reliably addressed by tag: `gh release view/download`
          # resolves drafts by listing them rather than by ref, and answers
          # "release not found" often enough that the checksum job cannot be
          # built on it. An id is unambiguous whether or not it is a draft.
          #
          # Creating it through the REST API rather than `gh release create` is
          # what makes the id available without asking for it: the POST returns
          # the release it just made. Listing releases to find one we already
          # know we created is an extra dependency on an endpoint that has
          # returned 503 mid-release, so it is only the fallback for the
          # already-exists case.
          list_id() {
            for attempt in 1 2 3 4 5; do
              id=$(gh api "repos/$REPO/releases" --paginate \
                     --jq '.[] | "\(.tag_name) \(.id)"' 2>/dev/null \
                   | awk -v tag="$TAG" '$1 == tag { print $2; exit }') || true
              if [ -n "${id:-}" ]; then printf '%s' "$id"; return 0; fi
              echo "releases list gave nothing (attempt $attempt) — retrying" >&2
              sleep $((attempt * 5))
            done
            return 1
          }

          cat > notes.md <<'NOTES'
          Prebuilt binaries for x86-64 Linux and Windows, and for macOS on both
          Intel and Apple Silicon: the
          `rai` inference CLI (`convert`, `run`, `serve`, `models`) and
          `rai-server`, plus the deprecated `rai-convert`, `rai-generate`, and
          `rai-chat` wrappers.

          **Verify your download before running it.** Fetch `SHA256SUMS` from
          this release, put it next to the archive, and run:

          ```
          sha256sum --ignore-missing -c SHA256SUMS
          ```

          The x86-64 archives are built with `-C target-cpu=x86-64-v2`, so they
          start on any x86-64 CPU from roughly 2009 onward, and their
          AVX2/FMA/F16C kernels are selected at runtime on CPUs that report
          them. The `aarch64-apple-darwin` archive is native Apple Silicon and
          runs the scalar kernels — there is no NEON path yet, so expect it to
          be slower than the x86 archives on comparable hardware.

          Setup and a sixty-second first run: see `INSTALL.md`.

          What changed in this release, and whether it fixes something you hit:
          see `CHANGELOG.md`.
          NOTES

          # The heredoc body carries this file's YAML indentation; strip it so
          # the release page is not one big code block.
          sed -i 's/^          //' notes.md

          # Three outcomes worth telling apart. 422 means the release already
          # exists, which is the rerun case. 5xx means GitHub is having a bad
          # day — that has taken a release down mid-flight, and it deserves a
          # retry rather than a tag that has to be cut again. Anything else is
          # a real failure and should stop the release.
          id=""
          for attempt in 1 2 3 4 5 6; do
            if id=$(gh api --method POST "repos/$REPO/releases" \
                      -f tag_name="$TAG" \
                      -f name="RAI $TAG" \
                      -F body=@notes.md \
                      -F draft=true \
                      -F prerelease=false \
                      --jq '.id' 2>create.err); then
              echo "created draft release $id"
              break
            fi

            cat create.err >&2

            if grep -q 'already_exists\|HTTP 422' create.err; then
              echo "Release $TAG already exists — reusing it."
              id=$(list_id)
              break
            fi

            if grep -qE 'HTTP 5[0-9][0-9]|No server is currently available' create.err; then
              echo "GitHub returned a server error (attempt $attempt) — retrying"
              id=""
              sleep $((attempt * 20))
              continue
            fi

            exit 1
          done

          test -n "$id"
          echo "release_id=$id" >> "$GITHUB_OUTPUT"
          echo "draft release id: $id"

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            rustflags: "-C target-cpu=x86-64-v2"
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            archive: zip
            rustflags: "-C target-cpu=x86-64-v2"
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
            rustflags: "-C target-cpu=x86-64-v2"
          # Apple Silicon, built natively on an ARM runner. No target-cpu is
          # pinned: the aarch64 baseline every M-series Mac shares is already
          # the toolchain default, and there is no NEON kernel to select for,
          # so the GEMM takes the scalar path. Slower than the x86 archives on
          # comparable hardware, and still far better than the Intel build
          # under Rosetta, which emulates no AVX2 at all.
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
            rustflags: ""

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Show pinned Rust toolchain and release flags
        shell: bash
        run: |
          rustc --version --verbose
          cargo --version --verbose
          echo "RUSTFLAGS=$RUSTFLAGS"

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}

      - name: Confirm the portable baseline actually took effect
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          # RUSTFLAGS (env) replaces whatever .cargo/config.toml sets. That
          # file pins the same portable floor today, but if someone puts
          # `target-cpu=native` back — or adds a second flag source, or the
          # precedence changes — this build would silently go back to shipping
          # native-only binaries. Assert instead of trusting.
          #
          # `native` is refused on every target. What counts as correct beyond
          # that depends on the architecture, so the check asks per target
          # rather than demanding one x86 answer everywhere.
          case "$RUSTFLAGS" in
            *target-cpu=native*)
              echo "::error::release build is using target-cpu=native — the artifacts would crash on older CPUs"
              exit 1 ;;
          esac

          case "$TARGET" in
            x86_64-*)
              case "$RUSTFLAGS" in
                *target-cpu=x86-64-v2*)
                  echo "portable x86 baseline confirmed: $RUSTFLAGS" ;;
                *)
                  echo "::error::$TARGET must pin target-cpu=x86-64-v2, got: '$RUSTFLAGS'"
                  exit 1 ;;
              esac ;;
            aarch64-*)
              # The toolchain default is the shared baseline here, and naming
              # a specific ARM CPU would narrow the archive to one machine.
              if [ -n "$RUSTFLAGS" ]; then
                echo "::error::$TARGET must build at the toolchain default, got: '$RUSTFLAGS'"
                exit 1
              fi
              echo "aarch64 baseline confirmed: toolchain default" ;;
            *)
              echo "::error::no baseline policy for target $TARGET"
              exit 1 ;;
          esac

      # Same command the CI release-build step runs, plus --locked. Only the
      # two crates that own shipped binaries are built.
      - name: Build release binaries
        shell: bash
        run: |
          cargo build --locked --release \
            --package classeve-rai-infer \
            --package classeve-rai-server

      # A compile is not an execution: a green build has shipped a stale or
      # broken exe before. Every binary the archive will carry answers
      # --version here, on the same runner and target that built it, and the
      # answer must name this release — not whatever was in a cache.
      - name: Run every shipped binary before packaging it
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          ext=""
          if [ "${RUNNER_OS}" = "Windows" ]; then ext=".exe"; fi
          for bin in rai rai-server rai-convert rai-generate rai-chat; do
            out="$("./target/release/${bin}${ext}" --version)"
            printf '%s: %s\n' "$bin" "$out"
            # Anchored to the end: a substring match would let 0.2.10 pass a
            # 0.2.1 gate.
            case "$out" in
              *" $VERSION") ;;
              *) echo "::error::${bin} --version answered '${out}', not ${VERSION}"
                 exit 1 ;;
            esac
          done

      - name: Stage archive contents
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          stage="dist/rai-${VERSION}-${TARGET}"
          mkdir -p "$stage"

          ext=""
          if [ "${RUNNER_OS}" = "Windows" ]; then ext=".exe"; fi

          # Every one of these is a user-facing product binary. A missing one is
          # a broken release, not a smaller archive — fail loudly. `rai` is the
          # CLI the documentation and the launchers use; the three legacy names
          # are deprecated wrappers kept so existing scripts keep working.
          for bin in rai rai-server rai-convert rai-generate rai-chat; do
            src="target/release/${bin}${ext}"
            if [ ! -f "$src" ]; then
              echo "::error::expected release binary $src was not produced"
              exit 1
            fi
            cp "$src" "$stage/"
          done

          # INSTALL.md is referenced from RUNNING.txt below, and the launchers
          # are useless if they are not next to the binary they start.
          cp LICENSE NOTICE README.md INSTALL.md "$stage/"
          cp -r launchers "$stage/"

          # `cp` preserves the checkout's mode, and tar preserves it again, so a
          # launcher committed without the executable bit reaches the user as a
          # file that cannot be double-clicked and answers `./rai-studio.sh`
          # with "Permission denied" — on the two platforms where those scripts
          # are the entire point. The index should carry 100755 (see
          # .gitattributes); this makes the shipped archive correct either way.
          chmod +x "$stage"/launchers/*.sh "$stage"/launchers/*.command

          for script in "$stage"/launchers/*.sh "$stage"/launchers/*.command; do
            [ -x "$script" ] || { echo "::error::$script is not executable in the archive"; exit 1; }
          done

          cat > "$stage/RUNNING.txt" <<RUNNING
          RAI ${VERSION} — ${TARGET}

          WHAT IS IN HERE
            rai           the inference CLI:
                            rai convert <model-dir>     checkpoint -> .raimodel
                            rai run <model.raimodel>    generate text
                            rai serve <model.raimodel>  local chat UI (:8090)
                            rai models [dir]            what is on this machine
            rai-server    local REST + MCP memory service
            launchers/    double-click scripts that start the chat UI

            rai-convert, rai-generate and rai-chat are deprecated wrappers over
            the same code, kept so existing scripts keep working. Use rai.

          BEFORE YOU RUN ANYTHING
            Verify the download against the release's SHA256SUMS:
              sha256sum --ignore-missing -c SHA256SUMS      (Linux/macOS)
              CertUtil -hashfile <archive> SHA256           (Windows)

          INSTALL
            Copy these binaries anywhere on your PATH. There is no installer,
            no service, and nothing is written outside the paths you name.

          SIXTY-SECOND FIRST RUN
            1) Convert a checkpoint you already have on disk. No Python is
               needed; rai convert writes tokenizer.json beside the model.
                 rai convert /path/to/TinyLlama-1.1B-Chat-v1.0 \\
                   -o tinyllama-q4.raimodel
            2) Generate. The tokenizer beside the model is found for you:
                 rai run tinyllama-q4.raimodel \\
                   --chat-template zephyr \\
                   --prompt "Explain photosynthesis in simple terms."

            Instruction-tuned models need their own chat template. Without
            --chat-template a chat model usually emits end-of-sequence at once
            and prints nothing. That is not a crash.

          CPU REQUIREMENTS
            These binaries are built for the x86-64-v2 baseline, so they start
            on any x86-64 CPU from roughly 2009 onward. The fast kernels need
            AVX2 + FMA + F16C and are chosen at runtime; without them RAI still
            runs, on scalar code, slower.

          NO GPU IS REQUIRED, AND NOTHING PHONES HOME
            rai serve and rai-server listen on loopback only. rai-server sends
            data off the machine only if you configure an external embedding
            provider yourself.

          MORE
            INSTALL.md, README.md, and https://github.com/Classevelabs/rai
          RUNNING

          # As above: the heredoc body carries this file's YAML indentation.
          sed -i.bak 's/^          //' "$stage/RUNNING.txt" && rm -f "$stage/RUNNING.txt.bak"

          ls -l "$stage"
          cat "$stage/RUNNING.txt"

      - name: Create tar.gz
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="rai-${VERSION}-${TARGET}"
          tar -C dist -czf "dist/${name}.tar.gz" "$name"
          ls -l "dist/${name}.tar.gz"

      - name: Create zip
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = "Stop"
          $name = "rai-$env:VERSION-$env:TARGET"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip" -Force
          Get-Item "dist/$name.zip"

      - name: Upload the archive to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        shell: bash
        run: |
          set -euo pipefail
          asset="dist/rai-${VERSION}-${TARGET}.${ARCHIVE}"
          test -f "$asset"
          test -n "$RELEASE_ID"

          name=$(basename "$asset")

          # By id, like every other release call here. `gh release upload`
          # resolves the release by tag, and a draft cannot be found that way
          # reliably — it failed on two of four runners while the builds
          # themselves were green.
          #
          # An asset of the same name already present is a rerun; the upload
          # API rejects the duplicate rather than replacing it, so clear it
          # first. That is what --clobber was doing.
          existing=$(gh api --paginate "repos/$REPO/releases/$RELEASE_ID/assets" \
                       --jq ".[] | select(.name == \"$name\") | .id" || true)
          for old in $existing; do
            echo "replacing existing asset $old"
            gh api --method DELETE "repos/$REPO/releases/assets/$old" || true
          done

          for attempt in 1 2 3 4 5; do
            if gh api --method POST \
                 "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$name" \
                 -H "Content-Type: application/octet-stream" \
                 --input "$asset" --silent; then
              echo "uploaded $name"
              exit 0
            fi
            echo "upload failed (attempt $attempt) — retrying"
            sleep $((attempt * 15))
          done

          echo "::error::could not upload $name after 5 attempts"
          exit 1

  checksums:
    name: Publish SHA256SUMS and release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download every archive back from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          # Hashing what the release actually serves — not what a build job
          # happened to have on disk — is the only version of this check that
          # can catch a truncated or clobbered upload.
          #
          # The release is still a draft at this point. `gh release download`
          # resolves drafts by listing them, but that is a fallback path inside
          # gh rather than a documented guarantee, so a failure here drops to
          # the REST API, which addresses assets by id and has no such
          # ambiguity. Either way the count is asserted below.
          # Addressed by id, not tag. `gh release download` resolves a draft by
          # listing releases rather than by ref and answers "release not found"
          # often enough that a release cannot be built on it; the id comes
          # from the job that created the release, so there is nothing to
          # resolve and nothing to race.
          test -n "$RELEASE_ID"

          # The API has answered 503 mid-release before. A transient outage
          # should cost a retry, not a release that has to be cut again.
          for attempt in 1 2 3 4 5; do
            if gh api --paginate "repos/$REPO/releases/$RELEASE_ID/assets" \
                 --jq '.[] | select(.name | test("^rai-.*\\.(tar\\.gz|zip)$")) | "\(.id) \(.name)"' \
                 > assets.txt; then
              break
            fi
            echo "asset listing failed (attempt $attempt) — retrying"
            sleep $((attempt * 5))
          done
          test -s assets.txt

          while read -r asset_id asset_name; do
            echo "downloading $asset_name"
            gh api -H "Accept: application/octet-stream" \
              "repos/$REPO/releases/assets/$asset_id" > "dist/$asset_name"
          done < assets.txt

          ls -l dist

          # One archive per entry in the build matrix. A short SHA256SUMS is
          # worse than none — it silently blesses some downloads and leaves the
          # rest unverifiable — so the count is asserted rather than assumed.
          # Keep this in step with the matrix in the build job.
          expected=4
          found=$(find dist -maxdepth 1 -type f \
            \( -name 'rai-*.tar.gz' -o -name 'rai-*.zip' \) | wc -l)
          if [ "$found" -ne "$expected" ]; then
            echo "::error::expected $expected release archives to hash, found $found"
            exit 1
          fi

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum rai-*.tar.gz rai-*.zip > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS

      - name: Attach SHA256SUMS and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          # By id, for the same reason as every other call here.
          existing=$(gh api --paginate "repos/$REPO/releases/$RELEASE_ID/assets" \
                       --jq '.[] | select(.name == "SHA256SUMS") | .id' || true)
          for old in $existing; do
            gh api --method DELETE "repos/$REPO/releases/assets/$old" || true
          done

          for attempt in 1 2 3 4 5; do
            if gh api --method POST \
                 "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=SHA256SUMS" \
                 -H "Content-Type: text/plain" \
                 --input dist/SHA256SUMS --silent; then
              echo "uploaded SHA256SUMS"
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::could not upload SHA256SUMS after 5 attempts"
              exit 1
            fi
            echo "SHA256SUMS upload failed (attempt $attempt) — retrying"
            sleep $((attempt * 15))
          done

          # Publish by id for the same reason the download does: the release is
          # still a draft at this point, so the tag is not a reliable handle.
          gh api --method PATCH "repos/$REPO/releases/$RELEASE_ID" -F draft=false             --jq '"published \(.tag_name) with \(.assets|length) assets"'
