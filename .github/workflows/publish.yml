name: Publish

# Publishes the two product crates to crates.io through OIDC trusted
# publishing: crates.io lists this repository and this workflow file as the
# trusted publisher for both crates, the exchange mints a token that lives for
# minutes, and no long-lived credential exists on any machine or in any
# secret. Dispatched by hand after a release, never on its own — publication
# is deliberate, and a published version cannot be taken back.
#
# `rem-nra`, `rai-core`, and `rai-server` are publish = false and stay out on
# purpose; see the note at the top of their manifests.

on:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse to republish an existing version
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          echo "workspace version: $version"
          for crate in classeve-rai-compress classeve-rai-infer; do
            prefix="${crate:0:2}/${crate:2:2}"
            if curl -fsS "https://index.crates.io/$prefix/$crate" | grep -q "\"vers\":\"$version\""; then
              echo "::error::$crate $version is already on crates.io; bump the workspace version instead"
              exit 1
            fi
          done

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish classeve-rai-compress
        run: cargo publish --locked -p classeve-rai-compress
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish classeve-rai-infer
        run: cargo publish --locked -p classeve-rai-infer
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
