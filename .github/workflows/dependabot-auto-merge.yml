name: dependabot auto-merge

# Fourteen Dependabot PRs once sat open here for two months. By the time anyone
# looked, twelve of them showed a red check that had nothing to do with the
# bump — their checks had run against a base commit that happened to be broken
# at that moment and was fixed minutes later. Stale red is indistinguishable
# from real red at a glance, so the pile stopped being readable and none of it
# got merged. Meanwhile the two that were genuinely broken hid in the noise.
#
# This is the triage a person would do, on a timer:
#
#   green            -> merge it; CI on the current base is the proof
#   red              -> rebase once, so the next verdict is about the bump
#                       and not about whoever broke main that afternoon
#   conflicted       -> ask Dependabot to rebuild the branch from scratch
#   still running    -> leave it; tomorrow's run will pick it up
#   major, shipped   -> never auto-merged. A green tick says "it compiles",
#                       not "the behaviour is unchanged"
#
# Dev-dependency and GitHub-Actions majors ARE merged on green: neither can
# reach a shipped artifact, so a passing build is the whole proof they need.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    # The sweep is a handful of API calls. Anything longer means a call is
    # hanging, and an hour of that is an hour of the month's minutes.
    timeout-minutes: 10
    steps:
      - name: Merge what CI has proved, rebase what it has not
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          numbers=$(gh pr list --repo "$REPO" --author "app/dependabot" \
            --state open --limit 50 --json number --jq '.[].number')

          if [ -z "$numbers" ]; then
            echo "No open Dependabot pull requests."
            exit 0
          fi

          for n in $numbers; do
            title=$(gh pr view "$n" --repo "$REPO" --json title --jq .title)
            echo "::group::#$n $title"

            # "deps-dev" and anything under actions/ cannot reach a shipped
            # artifact, so a major there is fine once CI agrees. A major bump of
            # a real dependency is the one case a green tick does not settle.
            if ! printf '%s' "$title" | grep -qiE 'deps-dev|actions/'; then
              from=$(printf '%s' "$title" | grep -oiE '\bfrom [0-9]+' | grep -oE '[0-9]+' || true)
              to=$(printf '%s' "$title" | grep -oiE '\bto [0-9]+' | grep -oE '[0-9]+' || true)
              if [ -n "$from" ] && [ -n "$to" ] && [ "$from" != "$to" ]; then
                echo "major bump of a shipped dependency ($from -> $to) — leaving for review"
                echo "::endgroup::"; continue
              fi
            fi

            mergeable=$(gh pr view "$n" --repo "$REPO" --json mergeable --jq .mergeable)
            if [ "$mergeable" = "CONFLICTING" ]; then
              # main moved somewhere this branch cannot be replayed onto.
              # Dependabot rebuilds it from the current base on request.
              echo "conflicted — asking Dependabot to recreate the branch"
              gh pr comment "$n" --repo "$REPO" --body "@dependabot recreate" || true
              echo "::endgroup::"; continue
            fi

            states=$(gh pr view "$n" --repo "$REPO" --json statusCheckRollup \
              --jq '[.statusCheckRollup[]? | (.conclusion // .state)] | join(" ")')

            case " $states " in
              *" PENDING "*|*" IN_PROGRESS "*|*" QUEUED "*|*"  "*)
                echo "checks still running — leaving it for tomorrow" ;;
              *" FAILURE "*|*" TIMED_OUT "*|*" CANCELLED "*|*" ERROR "*|*" STARTUP_FAILURE "*)
                # Genuinely broken, or judged against a base that was red at the
                # time. One rebase costs a CI run and tells the two apart.
                echo "red — rebasing so the next verdict is about this bump"
                gh pr update-branch "$n" --repo "$REPO" --rebase \
                  || gh pr comment "$n" --repo "$REPO" --body "@dependabot recreate" \
                  || true
                ;;
              " ")
                echo "no checks reported — leaving alone" ;;
              *)
                echo "CI green on the current base — merging"
                # Every merge moves main, so a lockfile bump can strand the
                # next one mid-sweep. That is ordinary, not a failure: hand it
                # back to Dependabot and keep going. Letting it abort the run
                # would leave the rest untriaged and paint this workflow red —
                # the exact thing it exists to prevent.
                if ! gh pr merge "$n" --repo "$REPO" --squash --delete-branch; then
                  echo "merge refused (main moved underneath) — asking Dependabot to recreate"
                  gh pr comment "$n" --repo "$REPO" --body "@dependabot recreate" || true
                fi
                ;;
            esac
            echo "::endgroup::"
          done

          echo "Sweep complete."
