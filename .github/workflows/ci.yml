name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: Minimum Rust 1.87
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install declared minimum Rust
        run: rustup toolchain install 1.87.0 --profile minimal

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-msrv-1.87.0-${{ hashFiles('Cargo.lock') }}

      - name: Check locked workspace at declared minimum
        run: cargo +1.87.0 check --workspace --all-targets --locked

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show pinned Rust toolchain
        run: |
          rustc --version --verbose
          cargo --version --verbose

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}

      - name: Verify locked dependency graph
        run: cargo metadata --locked --format-version 1 --no-deps

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --locked

      - name: Documentation tests
        run: cargo test --workspace --doc --locked

      - name: Release build
        run: cargo build --workspace --release --locked

      - name: Validate Python exporter syntax
        run: python3 -m compileall -q rai-infer/scripts

      - name: Run exporter conformance suite (numpy-only)
        env:
          # macOS runner pythons are PEP 668 externally-managed; CI machines
          # are ephemeral, so installing into the system environment is fine.
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        run: |
          python3 -m pip install --user 'numpy>=1.26'
          python3 rai-infer/scripts/test_raimodel.py
          # The suite regenerates the golden fixtures; they must byte-match
          # the committed ones or the Python writer has drifted from what the
          # Rust reader tests were validated against.
          git diff --exit-code rai-infer/tests/fixtures/

  supply-chain:
    name: Advisory and package gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}

      - name: Audit RustSec advisories
        run: |
          cargo install cargo-audit --version 0.22.2 --locked --no-default-features
          cargo audit --deny warnings

      - name: Verify publishable crate archives
        run: cargo package --workspace --locked

  container:
    name: Container build and MCP smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build pinned image
        run: docker build --tag rai-audit:local .

      # This used to assert only that the initialize response contained
      # "rai-server" — i.e. that the binary starts and can complete a
      # handshake. An image whose every tool was broken passed that check.
      # The shipped artifact is worth more than a greeting, so the smoke now
      # exercises the actual product: enumerate the tools, prove the
      # mutation-off default holds, and drive a real store -> recall round
      # trip through the container.
      - name: Smoke-test MCP handshake and tool surface
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"rai_store","arguments":{"content":"ci canary"}}}' \
            | docker run --rm -i rai-audit:local mcp \
            | tee /tmp/rai-mcp-surface.json

          grep -q '"name":"rai-server"' /tmp/rai-mcp-surface.json

          # Every read-only tool must actually be advertised by the image. A
          # build that silently drops one would otherwise ship unnoticed.
          for tool in rai_recall rai_intersect rai_contradict \
                      rai_surprise rai_memory_health rai_explain_confidence; do
            grep -q "\"$tool\"" /tmp/rai-mcp-surface.json \
              || { echo "::error::image does not advertise $tool"; exit 1; }
          done

          # Writes are opt-in, and the default does two things: it hides
          # rai_store from tools/list entirely, and it refuses the call if one
          # is made anyway. Both are asserted — a client that never sees the
          # tool cannot be tempted by it, and a client that guesses the name
          # still gets nothing. If either half inverts, an MCP client gains
          # silent write access to the operator's memory store.
          grep -q '"rai_store"' /tmp/rai-mcp-surface.json \
            && { echo "::error::rai_store is advertised with mutations disabled — the write tool must be hidden by default"; exit 1; }

          grep -q 'rai_store is disabled' /tmp/rai-mcp-surface.json \
            || { echo "::error::rai_store was NOT refused by default — the mutation opt-in has regressed"; exit 1; }

      - name: Smoke-test a real store and recall round trip
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"rai_store","arguments":{"content":"the ci canary fact about zebras"}}}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"rai_recall","arguments":{"query":"zebras"}}}' \
            | docker run --rm -i -e RAI_MCP_MUTATIONS_ENABLED=true rai-audit:local mcp \
            | tee /tmp/rai-mcp-roundtrip.json

          grep -q 'Stored successfully' /tmp/rai-mcp-roundtrip.json \
            || { echo "::error::rai_store did not store with mutations enabled"; exit 1; }

          # The stored text must come back out. Starting is not working.
          grep -q 'the ci canary fact about zebras' /tmp/rai-mcp-roundtrip.json \
            || { echo "::error::rai_recall did not return the stored content — the image starts but does not work"; exit 1; }

          # The recall payload is JSON inside a JSON-RPC text field, so the
          # field name arrives escaped as \"confidence\" — match it unquoted.
          grep -q 'confidence' /tmp/rai-mcp-roundtrip.json \
            || { echo "::error::recall response is missing its confidence field"; exit 1; }
