version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # rand_distr 0.6 uses the newer rand API while this workspace still uses
      # rand 0.8. Migrate both intentionally in one tested change.
      - dependency-name: rand_distr
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The Dockerfile pins base images by digest; without this ecosystem those
  # digests would never receive update PRs.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
