[workspace]
members = ["rem-nra", "rai-core", "rai-server", "rai-compress", "rai-infer"]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.87"
authors = ["ClassEve"]
license = "Apache-2.0"
homepage = "https://classeve.com"
repository = "https://github.com/Classevelabs/rai"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
