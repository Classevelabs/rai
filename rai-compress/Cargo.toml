[package]
name = "classeve-rai-compress"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Weight quantization and compression toolkit — GPTQ with calibration, adaptive bit allocation, bit-packing"

# Keep the original crate (import) name: benches do `use rai_compress::...`.
[lib]
name = "rai_compress"
path = "src/lib.rs"

[dependencies]
nalgebra = { version = "0.33", features = ["serde-serialize"] }
serde = { version = "1", features = ["derive"] }
rand = "0.8"
rand_distr = "0.4"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "compress_bench"
harness = false
