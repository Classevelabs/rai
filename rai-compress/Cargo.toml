[package]
name = "classeve-rai-compress"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Weight quantization and compression toolkit — GPTQ with calibration, adaptive bit allocation, bit-packing"
readme = "../README.md"
keywords = ["quantization", "compression", "gptq", "machine-learning"]
categories = ["compression", "science"]

# Keep the original crate (import) name: benches do `use rai_compress::...`.
[lib]
name = "rai_compress"
path = "src/lib.rs"

[dependencies]
nalgebra = "0.33"
thiserror = "2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"

[[bench]]
name = "compress_bench"
harness = false
