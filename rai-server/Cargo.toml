# NOT PART OF THE RAI PRODUCT (decided 2026-08-13).
#
# RAI is a CPU-only LLM inference engine: rai-infer plus rai-compress.
# This crate belongs to a separate memory/reasoning service that shares
# the workspace and nothing else — rai-server imports rai-infer zero
# times and cannot run a model.
#
# Publishing it under the RAI name told developers on crates.io that the
# product was something it is not. 0.1.0 is YANKED and publish is
# disabled so it cannot go back by accident.
# REST + MCP server for the memory/reasoning layer. NOT part of the RAI product.
[package]
publish = false
name = "classeve-rai-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Local REST and MCP server for the RAI memory and reasoning layer"
readme = "../README.md"
keywords = ["mcp", "memory", "reasoning", "ai", "server"]
categories = ["command-line-utilities", "web-programming::http-server"]

# Keep the installed binary named `rai-server` (default would follow the package name).
[[bin]]
name = "rai-server"
path = "src/main.rs"

[dependencies]
# Dependency key stays `rai-core` so `use rai_core::...` keeps resolving;
# `package` points at the published crates.io name.
rai-core = { path = "../rai-core", version = "0.2.1", package = "classeve-rai-core" }
axum = "0.8"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
